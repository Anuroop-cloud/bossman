{{- if not .Values.auth.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "bossman.secretName" .) -}}
{{- $data := ($existing).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bossman.secretName" . }}
  labels: {{- include "bossman.labels" . | nindent 4 }}
type: Opaque
data:
  # Values are kept stable across upgrades: explicit value > existing secret > random.
  adminToken: {{ (.Values.auth.adminToken | b64enc) | default (get $data "adminToken") | default (randAlphaNum 40 | b64enc) | quote }}
  operatorToken: {{ (.Values.auth.operatorToken | b64enc) | default (get $data "operatorToken") | default (randAlphaNum 40 | b64enc) | quote }}
  agentToken: {{ (.Values.auth.agentToken | b64enc) | default (get $data "agentToken") | default (randAlphaNum 40 | b64enc) | quote }}
  secretKey: {{ (.Values.auth.secretKey | b64enc) | default (get $data "secretKey") | default (randAlphaNum 48 | b64enc) | quote }}
  postgresPassword: {{ (.Values.postgresql.password | b64enc) | default (get $data "postgresPassword") | default (randAlphaNum 32 | b64enc) | quote }}
  {{- if .Values.auth.anthropicApiKey }}
  anthropicApiKey: {{ .Values.auth.anthropicApiKey | b64enc | quote }}
  {{- end }}
{{- end }}
