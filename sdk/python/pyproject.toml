[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bossman-sdk"
dynamic = ["version"]
description = "Connect any AI agent to a BOSSman control plane: supervision, recovery, leases, policy and approvals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
bossman = "bossman.cli:main"

[tool.setuptools.dynamic]
version = { attr = "bossman._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["bossman*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
