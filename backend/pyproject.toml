[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bossman-server"
dynamic = ["version"]
description = "BOSSman control plane: supervision, recovery and resource arbitration for AI agent fleets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "prometheus-client>=0.20.0",
    "jsonschema>=4.20.0",
    "pyyaml>=6.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
# In-process LangGraph agents (agents.base_agent / research_agent). The server
# itself never needs these — remote agents use the bossman-sdk package.
agents = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
]
llm = ["anthropic>=1.0.0"]
otel = [
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]
dev = [
    "bossman-server[agents,otel,llm]",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "fakeredis>=2.20.0",
]

[project.scripts]
bossmand = "bossman_server.cli:main"

[tool.setuptools.dynamic]
version = { attr = "bossman_server.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["bossman_server*"]

[tool.setuptools.package-data]
bossman_server = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py",
                  "policies/*.yaml", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs real Redis/PostgreSQL (docker compose up -d --wait)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
